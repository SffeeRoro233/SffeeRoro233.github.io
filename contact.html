<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contactez l'équipe Axion">
  <title>Axion - Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="banner">
    <nav>
      <div class="logo">
        <span class="logo-circle"></span>
        <span>Axi</span><span class="gradient-text">on</span>
      </div>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="a-propos.html">À propos</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <h1 class="gradient-text reveal">Contactez-nous</h1>
      <p class="reveal">Une question ? On vous répond rapidement.</p>
    </section>

    <section class="content reveal">
      <form id="contact-form">
        <label for="name">Nom</label>
        <input type="text" id="name" name="name" placeholder="Votre nom" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="vous@exemple.com" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="6" placeholder="Votre message..." required></textarea>

        <button type="submit" class="btn primary">Envoyer le message</button>
        <p id="form-status" class="form-status"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Axion - Tous droits réservés</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
